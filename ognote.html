<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ognote</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;
  --sidebar:#161b22;
  --nav:#161b22;
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
  --code-bg:#1c2128;
  --highlight:#ffe08a;
  --hl-bg:#3d3000;
  --active-bg:#1f2a3a;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'SF Mono',Consolas,'Liberation Mono',monospace;
  font-size:14px;
  line-height:1.6;
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}

/* NAV */
nav{
  background:var(--nav);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 16px;
  height:48px;
  gap:16px;
  flex-shrink:0;
  z-index:100;
}
.logo{
  font-size:16px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:1px;
  white-space:nowrap;
}
.search-wrap{
  flex:1;
  max-width:480px;
  position:relative;
}
.search-wrap input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  padding:6px 12px 6px 32px;
  font-size:13px;
  outline:none;
  font-family:inherit;
}
.search-wrap input:focus{border-color:var(--accent)}
.search-icon{
  position:absolute;
  left:9px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;
}
.search-count{
  font-size:12px;color:var(--muted);white-space:nowrap;
}
.search-nav{display:flex;gap:4px;align-items:center}
.search-nav button{
  background:var(--code-bg);border:1px solid var(--border);
  color:var(--text);border-radius:4px;padding:3px 8px;
  cursor:pointer;font-size:12px;
}
.search-nav button:hover{border-color:var(--accent);color:var(--accent)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
aside{
  width:260px;
  min-width:260px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:8px 0;
}
aside::-webkit-scrollbar{width:4px}
aside::-webkit-scrollbar-track{background:transparent}
aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.toc-item{
  display:block;
  padding:3px 12px;
  color:var(--muted);
  text-decoration:none;
  font-size:12px;
  line-height:1.5;
  border-left:2px solid transparent;
  transition:all .15s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toc-item:hover{color:var(--text);background:var(--active-bg)}
.toc-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--active-bg)}
.toc-item.l1{font-size:13px;font-weight:600;color:var(--text);padding-top:10px;padding-left:12px}
.toc-item.l2{padding-left:20px}
.toc-item.l3{padding-left:32px}
.toc-item.l4{padding-left:44px}

/* MAIN */
main{
  flex:1;
  overflow-y:auto;
  padding:32px 48px;
}
main::-webkit-scrollbar{width:6px}
main::-webkit-scrollbar-track{background:transparent}
main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.content h1{
  font-size:22px;font-weight:700;
  color:var(--accent);
  margin:40px 0 16px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}
.content h2{
  font-size:17px;font-weight:600;
  color:#79c0ff;
  margin:28px 0 12px;
}
.content h3{
  font-size:15px;font-weight:600;
  color:#d2a8ff;
  margin:20px 0 8px;
}
.content h4{
  font-size:13px;font-weight:600;
  color:#ffa657;
  margin:16px 0 6px;
}
.content p{margin:8px 0;color:var(--text)}
.content a{color:var(--accent);text-decoration:none}
.content a:hover{text-decoration:underline}
.content ul,.content ol{margin:8px 0 8px 20px}
.content li{margin:3px 0}
.content pre{
  background:var(--code-bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:14px 16px;
  overflow-x:auto;
  margin:10px 0;
  font-size:12.5px;
  line-height:1.55;
}
.content pre::-webkit-scrollbar{height:4px}
.content pre::-webkit-scrollbar-thumb{background:var(--border)}
.content code{
  background:var(--code-bg);
  border-radius:3px;
  padding:1px 5px;
  font-size:12.5px;
  font-family:inherit;
  color:#ff7b72;
}
.content pre code{
  background:none;padding:0;color:var(--text);
}
.content table{
  border-collapse:collapse;
  margin:10px 0;width:100%;font-size:13px;
}
.content th,.content td{
  border:1px solid var(--border);
  padding:6px 10px;text-align:left;
}
.content th{background:var(--code-bg);color:var(--accent)}
.content strong{color:#ffa657}
.content em{color:#d2a8ff}
.content blockquote{
  border-left:3px solid var(--accent);
  padding:6px 12px;
  color:var(--muted);
  margin:8px 0;
  background:var(--code-bg);
  border-radius:0 4px 4px 0;
}
.content hr{border:none;border-top:1px solid var(--border);margin:20px 0}

/* HIGHLIGHT */
mark.hl{
  background:var(--hl-bg);
  color:var(--highlight);
  border-radius:2px;
  padding:0 1px;
}

/* No results */
.no-results{
  display:none;
  color:var(--muted);
  text-align:center;
  padding:40px;
  font-size:14px;
}
</style>
</head>
<body>

<nav>
  <span class="logo">ognote</span>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search notes..." autocomplete="off"/>
  </div>
  <span class="search-count" id="searchCount"></span>
  <div class="search-nav">
    <button onclick="navSearch(-1)" title="Previous">↑</button>
    <button onclick="navSearch(1)" title="Next">↓</button>
    <button onclick="clearSearch()" title="Clear">✕</button>
  </div>
</nav>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="content" id="content"></div>
    <div class="no-results" id="noResults">No results found.</div>
  </main>
</div>

// Render content
const contentEl = document.getElementById('content');

// Add IDs to headings based on text
function slugify(text) {
  return text.toLowerCase()
    .replace(/[*_`]/g,'')
    .replace(/[^\w\s-]/g,'')
    .replace(/[\s_]+/g,'-')
    .replace(/^-+|-+$/g,'');
}

contentEl.querySelectorAll('h1,h2,h3,h4').forEach(h => {
  if(!h.id) {
    h.id = slugify(h.textContent);
  }
});

// Scroll spy
const mainEl = document.getElementById('main');
const tocLinks = document.querySelectorAll('.toc-item');

mainEl.addEventListener('scroll', () => {
  let current = '';
  contentEl.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    if(h.offsetTop <= mainEl.scrollTop + 80) current = h.id;
  });
  tocLinks.forEach(a => {
    a.classList.toggle('active', a.dataset.anchor === current);
  });
});

tocLinks.forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const target = document.getElementById(a.dataset.anchor);
    if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
  });
});

// === SEARCH ===
let matches = [];
let currentMatch = -1;
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
const noResults = document.getElementById('noResults');

function clearSearch() {
  searchInput.value = '';
  doSearch('');
  searchInput.focus();
}

function doSearch(query) {
  // Reset content
  contentEl.innerHTML = RAW_HTML;
  contentEl.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    if(!h.id) h.id = slugify(h.textContent);
  });
  matches = [];
  currentMatch = -1;

  if(!query || query.trim().length < 2) {
    searchCount.textContent = '';
    noResults.style.display = 'none';
    return;
  }

  const q = query.trim();
  const regex = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');

  // Walk text nodes and highlight
  function walk(node) {
    if(node.nodeType === 3) {
      if(regex.test(node.nodeValue)) {
        const span = document.createElement('span');
        span.innerHTML = node.nodeValue.replace(regex, '<mark class="hl">$1</mark>');
        node.parentNode.replaceChild(span, node);
      }
    } else if(node.nodeType === 1 && !['SCRIPT','STYLE'].includes(node.tagName)) {
      Array.from(node.childNodes).forEach(walk);
    }
  }
  walk(contentEl);

  matches = Array.from(contentEl.querySelectorAll('mark.hl'));

  if(matches.length === 0) {
    searchCount.textContent = 'No results';
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    currentMatch = 0;
    scrollToMatch(0);
    updateCount();
  }
}

function scrollToMatch(idx) {
  matches.forEach((m,i) => m.style.outline = i===idx ? '2px solid #ffe08a' : 'none');
  if(matches[idx]) {
    matches[idx].scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function updateCount() {
  if(matches.length === 0) return;
  searchCount.textContent = (currentMatch+1) + ' / ' + matches.length;
}

function navSearch(dir) {
  if(matches.length === 0) return;
  currentMatch = (currentMatch + dir + matches.length) % matches.length;
  scrollToMatch(currentMatch);
  updateCount();
}

let debounce;
searchInput.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => doSearch(searchInput.value), 200);
});
